[workspace]
resolver = "3"
members = [
    "crates/rngkit-core",
    "crates/rngkit-sources",
    "crates/rngkit-analysis",
    "crates/rngkit-recording",
    "crates/rngkit-engine",
    "crates/rngkit-xlsx",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Thiagojm <tjm.plastica@gmail.com>"]
repository = "https://github.com/Thiagojm/rngkit-core"

[workspace.dependencies]
rngkit-core = { path = "crates/rngkit-core", version = "0.1.0" }
rngkit-analysis = { path = "crates/rngkit-analysis", version = "0.1.0" }
rngkit-recording = { path = "crates/rngkit-recording", version = "0.1.0" }
rngkit-engine = { path = "crates/rngkit-engine", version = "0.1.0" }
rngkit-sources = { path = "crates/rngkit-sources", version = "0.1.0" }
rngkit-xlsx = { path = "crates/rngkit-xlsx", version = "0.1.0" }

thiserror = "2.0.12"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
time = { version = "0.3.41", features = ["formatting", "parsing", "macros", "serde-well-known", "local-offset"] }
csv = "1.3.1"
sha2 = "0.10.9"
rustix = { version = "1.1.4", features = ["fs"] }
rust_xlsxwriter = "=0.96.0"
calamine = "=0.35.0"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tempfile = "3.19.1"

bitb-rs = { git = "https://github.com/Thiagojm/bitb-rs", rev = "18e586e5e2cf3e14742d1cd86f593a8ad1adbe3d" }
trng3-rs = { git = "https://github.com/Thiagojm/trng3-rs", rev = "08f1889a0e21f39b1f418073c829c3de250419b6" }
intel_seed = { git = "https://github.com/Thiagojm/intel_seed-rs", rev = "182740952a44304302420a5589f134964d5e792a" }
pseudo_rng = { git = "https://github.com/Thiagojm/pseudo_rng-rs", rev = "1c728bc7c5dc30f2225649751eb3da35b63aad9b" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
correctness = "deny"
suspicious = "warn"
style = "warn"
complexity = "warn"
perf = "warn"
